<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>D12 Ball</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="front">
    <main class="front-door panel">
      <div class="panel-label">D12 Ball</div>
      <p class="quiet">
        Create a room and send its link: the first two people in are
        its coaches, and anybody after them watches. The tutorial and
        the AI are both choices you make once you are in.
      </p>
      <form id="open-form" autocomplete="off">
        <label for="name-input" class="panel-label">Your name</label>
        <input id="name-input" class="chat-input" maxlength="32" required />
        <p id="name-error" class="quiet" hidden></p>
        <div class="row">
          <button type="submit" class="btn primary">Create a new game room</button>
          <button type="button" class="btn secondary" id="save-name">Save name</button>
        </div>
      </form>
      <p class="quiet"><button type="button" class="linkish" id="leave-app">Leave</button></p>

      <section id="mine" hidden>
        <div class="panel-label">Your rooms</div>
        <div id="mine-list" class="room-list"></div>
      </section>

      <section id="open" hidden>
        <div class="panel-label">Rooms with a seat free</div>
        <div id="open-list" class="room-list"></div>
      </section>
    </main>
    <script src="/static/index.js"></script>
  </body>
</html>
