name: tests

# Runs on every pull request, and on pushes straight to main so that a
# commit that never went through a pull request is still checked.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13, so the audioop-lts pin is exercised: requirements.txt installs
          # audioop-lts there and skips it below 3.13 (audioop is stdlib).
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests
