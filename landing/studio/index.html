<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$publisher</title>
<meta name="description" content="$description">
<link rel="canonical" href="$origin/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="$publisher">
<meta property="og:title" content="$publisher">
<meta property="og:description" content="$description">
<meta property="og:url" content="$origin/">
<meta property="og:image" content="$origin/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="$ground">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="colours.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav class="nav">
  <div class="wrap nav-row">
    <a class="brand serif" href="#top">$publisher</a>
    <div class="nav-links">
      <a href="#games">Games</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<header id="top" class="band studio-hero">
  <div class="wrap studio-hero-row">
    <div class="studio-hero-copy">
      <p class="kicker">A tabletop gaming studio</p>
      <h1 class="studio-paragraph serif">$paragraph</h1>
      <a class="button button-quiet" href="#games">See the games</a>
    </div>
    <div class="studio-hero-art" aria-hidden="true">
      <img class="hero-box" src="images/cover-night.jpg" width="1200" height="1200" alt="">
      $hero_coins
    </div>
  </div>
</header>

<main>
  <section id="games" class="band band-alt">
    <div class="wrap">
      <p class="kicker">Games</p>
      <h2 class="serif section-heading">Two at the table</h2>
      <div class="game-grid">
        <article class="card game-card">
          <img class="game-picture" src="images/banner-1500.jpg" width="1500" height="600"
               alt="$title: four players of the four species on a night field">
          <div class="game-body">
            <div class="game-head">
              <h3 class="display"><a href="$game_origin">$title</a></h3>
              $game_stage
            </div>
            <p>$game_overview</p>
            <div class="chips">
            $game_chips
            </div>
            <a class="game-link" href="$game_origin">$game_address</a>
          </div>
        </article>
        <article class="card game-card">
          <div class="game-picture game-picture-panel">
            <img src="images/folly.png" width="1200" height="480"
                 alt="The Fortune die showing 12 and the Doom die showing 1, with the six coins round them">
          </div>
          <div class="game-body">
            <div class="game-head">
              <h3 class="serif"><a href="$folly_url">$folly_title</a></h3>
              $folly_stage
            </div>
            <p>$folly_callout</p>
            <p class="game-aside">$folly_mechanic</p>
            <a class="game-link" href="$folly_url">Read more about the system</a>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>

<footer id="contact" class="footer">
  <div class="wrap footer-row">
    <span class="serif footer-name">$publisher</span>
    <a href="mailto:$contact">$contact</a>
    <span>$year</span>
  </div>
</footer>
</body>
</html>
