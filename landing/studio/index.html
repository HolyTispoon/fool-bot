<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$publisher</title>
<meta name="description" content="$description">
<link rel="canonical" href="$origin/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="$publisher">
<meta property="og:title" content="$publisher">
<meta property="og:description" content="$description">
<meta property="og:url" content="$origin/">
<meta property="og:image" content="$origin/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="$ground">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="colours.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav class="nav">
  <div class="wrap nav-row">
    <a class="brand serif" href="#top">$publisher</a>
    <div class="nav-links">
      <a href="#games">Games</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<header id="top" class="band studio-hero">
  <div class="wrap">
    <p class="kicker">A tabletop gaming studio</p>
    <p class="studio-paragraph serif">$paragraph</p>
  </div>
</header>

<main>
  <section id="games" class="band band-alt">
    <div class="wrap">
      <p class="kicker">Games</p>
      <div class="game-grid">
        <article class="card game-card">
          <h2 class="display"><a href="$game_origin">$game_title</a></h2>
        </article>
        <article class="card game-card">
          <h2 class="serif">Prophetic Folly</h2>
        </article>
      </div>
    </div>
  </section>
</main>

<footer id="contact" class="footer">
  <div class="wrap footer-row">
    <span class="serif footer-name">$publisher</span>
    <a href="mailto:$contact">$contact</a>
    <span>$year</span>
  </div>
</footer>
</body>
</html>
